name: Deploy to EC2

on:
  push:
    tags:
      - "v*.*.*"

permissions:
  contents: read

concurrency:
  group: deploy-production
  cancel-in-progress: false
  queue: max

env:
  IMAGE_NAME: moamoa-server

jobs:
  publish:
    name: Build and Push Image
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          fetch-depth: 0

      - name: Validate release tag
        run: |
          if [[ ! "$GITHUB_REF_NAME" =~ ^v[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            echo "::error::Invalid tag: $GITHUB_REF_NAME (expected vX.Y.Z)"
            exit 1
          fi
          if ! git merge-base --is-ancestor "$GITHUB_SHA" origin/release; then
            echo "::error::Tag $GITHUB_REF_NAME is not on the release branch"
            exit 1
          fi

      - name: Set up Java 21
        uses: actions/setup-java@b843ebf9b913146b38da2eaa7aeddf76074ae1ad # v6
        with:
          distribution: temurin
          java-version: '21'

      - name: Test and build JAR
        run: ./gradlew clean test bootJar --no-daemon

      - name: Build and push Docker image
        env:
          DOCKERHUB_USERNAME: ${{ secrets.DOCKERHUB_USERNAME }}
          DOCKERHUB_TOKEN: ${{ secrets.DOCKERHUB_TOKEN }}
        run: |
          IMAGE="$DOCKERHUB_USERNAME/$IMAGE_NAME:$GITHUB_REF_NAME"
          echo "$DOCKERHUB_TOKEN" | docker login -u "$DOCKERHUB_USERNAME" --password-stdin
          docker build --platform linux/amd64 -t "$IMAGE" .
          docker push "$IMAGE"

  deploy:
    name: Deploy to EC2
    needs: publish
    runs-on: ubuntu-latest
    environment: production
    env:
      EC2_HOST: ${{ secrets.EC2_HOST }}
      EC2_USERNAME: ${{ secrets.EC2_USERNAME }}
    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: Create runtime env file
        env:
          EC2_SSH_KEY: ${{ secrets.EC2_SSH_KEY }}
          EC2_KNOWN_HOSTS: ${{ secrets.EC2_KNOWN_HOSTS }}
          DOCKERHUB_USERNAME: ${{ secrets.DOCKERHUB_USERNAME }}
          PROD_DB_NAME: ${{ vars.PROD_DB_NAME }}
          PROD_DB_USERNAME: ${{ vars.PROD_DB_USERNAME }}
          PROD_DB_PASSWORD: ${{ secrets.PROD_DB_PASSWORD }}
        run: |
          for name in EC2_HOST EC2_USERNAME EC2_SSH_KEY EC2_KNOWN_HOSTS DOCKERHUB_USERNAME PROD_DB_NAME PROD_DB_USERNAME PROD_DB_PASSWORD; do
            if [ -z "${!name}" ]; then
              echo "::error::Required setting is missing: $name"
              exit 1
            fi
          done
          for name in DOCKERHUB_USERNAME PROD_DB_NAME PROD_DB_USERNAME PROD_DB_PASSWORD; do
            case "${!name}" in
              *"'"* | *$'\n'* | *$'\r'*)
                echo "::error::$name must not contain single quotes or line breaks"
                exit 1
                ;;
            esac
          done
          umask 077
          {
            printf "APP_IMAGE='%s'\n" "$DOCKERHUB_USERNAME/$IMAGE_NAME:$GITHUB_REF_NAME"
            printf "DB_NAME='%s'\n" "$PROD_DB_NAME"
            printf "DB_USERNAME='%s'\n" "$PROD_DB_USERNAME"
            printf "DB_PASSWORD='%s'\n" "$PROD_DB_PASSWORD"
          } > runtime.env

      - name: Set up SSH key
        env:
          EC2_SSH_KEY: ${{ secrets.EC2_SSH_KEY }}
          EC2_KNOWN_HOSTS: ${{ secrets.EC2_KNOWN_HOSTS }}
        run: |
          install -m 700 -d ~/.ssh
          printf '%s\n' "$EC2_SSH_KEY" > ~/.ssh/deploy_key
          chmod 600 ~/.ssh/deploy_key
          printf '%s\n' "$EC2_KNOWN_HOSTS" > ~/.ssh/known_hosts
          chmod 644 ~/.ssh/known_hosts
          printf 'StrictHostKeyChecking yes\n' > ~/.ssh/config
          chmod 600 ~/.ssh/config

      - name: Copy deploy files
        run: |
          ssh -i ~/.ssh/deploy_key "$EC2_USERNAME@$EC2_HOST" 'mkdir -p ~/moamoa'
          scp -i ~/.ssh/deploy_key deploy/compose.yml "$EC2_USERNAME@$EC2_HOST:moamoa/compose.yml"
          scp -i ~/.ssh/deploy_key runtime.env "$EC2_USERNAME@$EC2_HOST:moamoa/.env.next"

      - name: Start containers
        run: |
          ssh -i ~/.ssh/deploy_key "$EC2_USERNAME@$EC2_HOST" '
            set -e
            cd ~/moamoa
            chmod 600 .env.next
            docker compose --env-file .env.next -f compose.yml config --quiet
            docker compose --env-file .env.next -f compose.yml pull app
            if [ -f .env ]; then cp -p .env .env.prev; else rm -f .env.prev; fi
            mv .env.next .env
            docker compose up -d'

      - name: Check health
        run: |
          ssh -i ~/.ssh/deploy_key "$EC2_USERNAME@$EC2_HOST" '
            cd ~/moamoa
            wait_healthy() {
              for i in $(seq 1 30); do
                curl -fsS http://localhost:8080/actuator/health && return 0
                sleep 5
              done
              return 1
            }
            if wait_healthy; then
              docker image prune -af
              exit 0
            fi
            docker compose logs --tail=100 app
            if [ ! -f .env.prev ]; then
              echo "Health check failed and there is no previous version to roll back to"
              exit 1
            fi
            echo "Health check failed, rolling back to $(grep "^APP_IMAGE=" .env.prev)"
            mv .env.prev .env
            docker compose up -d
            if wait_healthy; then
              echo "Rollback succeeded"
            else
              echo "Rollback failed"
              docker compose logs --tail=100 app
            fi
            exit 1'
